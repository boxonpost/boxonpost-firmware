name: Idea or new radio request
description: Suggest a feature, or ask for BoxOnPost on a radio we don't support yet.
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea, or name the radio (make and model) you'd like supported.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
    validations:
      required: false
  - type: checkboxes
    id: tester
    attributes:
      label: Testing
      options:
        - label: I own this radio and can help test it.
